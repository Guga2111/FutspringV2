# nginx site of futspring.luisgosampaio.com (VPS: /etc/nginx/sites-available/futspring, linked in sites-enabled).
# Taken from the VPS on 2026-11-11; the Certbot lines are kept as Certbot wrote them.
# Applied by hand (deploy.sh doesn't touch nginx):
#   scp ops/nginx/futspring.conf root@<VPS_IP>:/etc/nginx/sites-available/futspring
#   ssh root@<VPS_IP> 'nginx -t && systemctl reload nginx'

server {
    server_name futspring.luisgosampaio.com;

    root /var/www/futspring;
    index index.html;

    # gzip is on in nginx.conf, but only for text/html; the API's JSON compresses 70-85%
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # PWA: the service worker, the manifest and index.html (also the SPA fallback) are revalidated on every
    # load, so a phone sees a new version; the hashed files in /assets/ keep a long cache
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Every document of the SPA is served from here (the fallback of `location /` lands on this location), and an
    # add_header inside a location drops the server-level ones, so the CSP lives here.
    # Report-Only while the app is checked in production (the web app reports each violation to /client-errors, source
    # CSP, so they show in Loki as event=client_error); then rename the
    # header to Content-Security-Policy. script-src carries the hash of the inline theme script of client/index.html:
    # editing that script changes the hash, and client/src/lib/csp.test.ts fails until it is updated here.
    # style-src 'unsafe-inline': Radix, recharts and sonner write style attributes. connect-src lists the wss:
    # host because older Safari doesn't match WebSockets with 'self'.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-CTMceqXouc4dDvn/k/Oepf7GbQygRh1IIxWf2eBRGx0='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://futspring.luisgosampaio.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API (127.0.0.1:${API_PORT}, published by docker-compose.prod.yml on IPv4 loopback only). The trailing
    # slash strips /api, so requests reach the API as /api/v1/... (VITE_API_URL ends in /api).
    # X-Forwarded-For is overwritten with the real client address, never appended to: the API's rate limits are
    # per client IP (Tomcat's RemoteIpValve also ignores values injected at the left, as a second guard).
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over SockJS (the app opens new SockJS("/ws")), with the WebSocket upgrade
    location /ws/ {
        proxy_pass http://127.0.0.1:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/futspring.luisgosampaio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/futspring.luisgosampaio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = futspring.luisgosampaio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name futspring.luisgosampaio.com;
    return 404; # managed by Certbot
}
