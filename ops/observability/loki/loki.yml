# Single-binary Loki on the local disk (volume loki_data), 14 days of logs. Reached only inside the observability
# network (Alloy pushes, Grafana queries); no port is published.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h # 14 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # the API's lines carry everything in the JSON body; labels stay few (service, project, container, level)
  max_label_names_per_series: 10

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
