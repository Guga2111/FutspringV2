# Observability stack shared by every project on the VPS: Prometheus, Grafana, node-exporter, cAdvisor, and the logs
# (Loki, Alloy, docker-proxy).
# Deployed by .github/workflows/deploy-observability.yml to ~/observability; see README.md.
# Nothing is published except Grafana on 127.0.0.1:8088 (nginx serves it as grafana.luisgosampaio.com).
name: observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    networks: [observability]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8088}
      # read by provisioning/alerting/contact-points.yml (the Telegram contact point; the chat id is in that file)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # only the bundled Prometheus datasource is used
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    # ~160 MiB idle; headroom for the larger community dashboards
    mem_limit: 384m
    depends_on: [prometheus, loki]
    networks: [observability]
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    mem_limit: 64m
    networks: [observability]
    logging: *logging

  cadvisor:
    # published on ghcr.io since v0.53 (gcr.io stops at v0.52)
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    # 2 vCPU shared by every project: slow housekeeping, only Docker containers, no expensive metrics.
    # disk / diskIO stay off: the disk metrics walk every container's overlay files (du), which took minutes per
    # container on the VPS, pinned cAdvisor at its memory limit and pushed the load average past 11
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=disk,diskIO,advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m
    networks: [observability]
    logging: *logging

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    mem_limit: 384m
    networks: [observability]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data, --disable-reporting]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # read positions, so a restart doesn't ship the same lines again
      - alloy_data:/var/lib/alloy/data
    mem_limit: 192m
    depends_on: [loki, docker-proxy]
    networks: [observability, docker-proxy]
    logging: *logging

  docker-proxy:
    # The only container with the Docker socket. ":ro" on a socket doesn't restrict the API, so the proxy does:
    # only GET /containers/** (list, inspect, logs) and GET /networks (Alloy's discovery labels) are allowed;
    # every other path and every POST/PUT/DELETE gets 403. On an internal network shared with Alloy alone
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # HAProxy, ~25 MiB idle
    mem_limit: 64m
    networks: [docker-proxy]
    logging: *logging

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  observability:
    # created by both deploys: docker network create observability; every scraped project joins it
    external: true
  docker-proxy:
    # Alloy ↔ docker-proxy only; no route out
    internal: true
