spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.threads.virtual.enabled=true
spring.task.execution.mode=force
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-hmac
app.jwt.expiration-ms=3600000
app.frontend-url=http://localhost:5173
app.api-url=http://localhost:8080
app.mail.resend-api-key=
app.mail.from=Futspring <no-reply@example.com>
app.uploads.dir=${java.io.tmpdir}/futspring-test-uploads
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true
# H2 builds the schema from the entities; migrations run against Postgres in FlywayMigrationTest
spring.flyway.enabled=false

# Same management setup as production, on a random internal port
management.server.port=0
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.metrics.tags.application=futspring

# OpenAPI docs off, as in production (OpenApiDocsTest turns them on)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.finance.receipts-dir=${java.io.tmpdir}/futspring-test-finance-receipts
app.finance.qr-dir=${java.io.tmpdir}/futspring-test-finance-qr

# Hibernate Statistics for QueryCounter (N+1 tests); production keeps them off
spring.jpa.properties.hibernate.generate_statistics=true
# no "Session Metrics" log after every session
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# Web Push off in tests (no-op sender); tests that send use a fake WebPushSender
app.push.vapid-public-key=
app.push.vapid-private-key=
app.push.vapid-subject=mailto:test@futspring.test

# A fake billing Pix, so the Assinatura area's integration tests get BR Codes
app.billing.pix-key=11999990000
app.billing.pix-name=Futspring Teste Recebedor
app.billing.pix-merchant-name=Futspring Teste
app.billing.pix-city=Sao Paulo
