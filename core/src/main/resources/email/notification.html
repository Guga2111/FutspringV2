<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!--
  Notification e-mail (NotificationEmail), one template for every emailable NotificationType. Same structure
  as password-reset.html: table layout, inline styles and MSO conditionals. Placeholders (HTML-escaped by
  NotificationEmail, replaced in one pass): {{appUrl}}, {{title}}, {{body}}, {{ctaLabel}}, {{ctaUrl}},
  {{categoryLabel}}, {{preferencesUrl}}, {{unsubscribeUrl}}. The logo is an inline attachment
  (cid:futspring-logo, resources/email/futspring-logo.png). Colors: brand #149440, text #0F2E1A, background #E8F5EC.
-->
<html dir="ltr" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta content="telephone=no" name="format-detection">
  <title>{{title}}</title><!--[if (mso 16)]>
    <style type="text/css">
    a {text-decoration: none;}
    </style>
    <![endif]--><!--[if gte mso 9]><style>sup { font-size: 100% !important; }</style><![endif]--><!--[if gte mso 9]>
<noscript>
         <xml>
           <o:OfficeDocumentSettings>
           <o:AllowPNG></o:AllowPNG>
           <o:PixelsPerInch>96</o:PixelsPerInch>
           </o:OfficeDocumentSettings>
         </xml>
      </noscript>
<![endif]--><!--[if mso]><xml>
    <w:WordDocument xmlns:w="urn:schemas-microsoft-com:office:word">
      <w:DontUseAdvancedTypographyReadingMail/>
    </w:WordDocument>
    </xml><![endif]--><!--[if !mso]><!-- -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"><!--<![endif]-->
  <style type="text/css">
u + .body img ~ div div {
  display:none;
}
#outlook a {
  padding:0;
}
span.MsoHyperlink,
span.MsoHyperlinkFollowed {
  color:inherit;
  mso-style-priority:99;
}
a.es-button {
  mso-style-priority:100!important;
  text-decoration:none!important;
}
a[x-apple-data-detectors],
#MessageViewBody a {
  color:inherit!important;
  text-decoration:none!important;
  font-size:inherit!important;
  font-family:inherit!important;
  font-weight:inherit!important;
  line-height:inherit!important;
}
@media only screen and (max-width:600px) {
  .es-m-p20l { padding-left:20px!important }
  .es-m-p20r { padding-right:20px!important }
  .es-m-p25b { padding-bottom:25px!important }
  p, a { line-height:150%!important }
  h1 { font-size:32px!important; line-height:120%!important }
  h5 { font-size:18px!important; line-height:120%!important }
  .es-content-body p { font-size:16px!important }
  .es-step a { font-size:17px!important }
  a.es-button { display:inline-block!important; font-size:18px!important; padding:12px 24px!important; line-height:120%!important }
  .es-content, .es-header, .es-footer { width:100%!important; max-width:600px!important }
  .es-content table, .es-header table, .es-footer table { width:100%!important; max-width:600px!important }
  .es-step-table { width:auto!important }
}
</style>
 </head>
 <body class="body" style="width:100%;height:100%;font-family:Inter, Arial, sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;padding:0;Margin:0">
  <!-- Inbox preview text -->
  <div style="display:none;font-size:1px;color:#E8F5EC;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all">{{body}}</div>
  <div dir="ltr" class="es-wrapper-color" lang="pt-BR" style="background-color:#F6F6F6"><!--[if gte mso 9]>
            <v:background xmlns:v="urn:schemas-microsoft-com:vml" fill="t">
                <v:fill type="tile" color="#f6f6f6"></v:fill>
            </v:background>
        <![endif]-->
   <table width="100%" cellspacing="0" cellpadding="0" class="es-wrapper" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;padding:0;Margin:0;width:100%;height:100%">
    <tbody>
     <tr>
      <td valign="top" style="padding:0;Margin:0">
       <!-- Header: logo -->
       <table cellspacing="0" cellpadding="0" align="center" class="es-header" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;width:100%;table-layout:fixed !important">
        <tbody>
         <tr>
          <td align="center" style="padding:0;Margin:0">
           <table cellspacing="0" cellpadding="0" bgcolor="#E8F5EC" align="center" class="es-header-body" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;background-color:#E8F5EC;width:600px">
            <tbody>
             <tr>
              <td align="left" class="es-m-p25b es-m-p20l es-m-p20r" style="Margin:0;padding:25px 35px 20px">
               <table cellspacing="0" cellpadding="0" role="presentation" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px">
                <tbody>
                 <tr>
                  <td valign="middle" style="padding:0 12px 0 0;Margin:0;font-size:0"><a target="_blank" href="{{appUrl}}" style="text-decoration:none"><img src="cid:futspring-logo" alt="Futspring" width="56" height="48" title="Futspring" style="display:block;border:0;outline:none;text-decoration:none;margin:0"></a></td>
                  <td valign="middle" style="padding:0;Margin:0"><a target="_blank" href="{{appUrl}}" style="mso-line-height-rule:exactly;text-decoration:none;font-family:Inter, Arial, sans-serif;font-size:22px;font-weight:bold;color:#0F2E1A">Futspring</a></td>
                 </tr>
                </tbody>
               </table></td>
             </tr>
            </tbody>
           </table></td>
         </tr>
        </tbody>
       </table>
       <!-- Content -->
       <!-- Content -->
       <table align="center" cellspacing="0" cellpadding="0" class="es-content" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;width:100%;table-layout:fixed !important">
        <tbody>
         <tr>
          <td align="center" style="padding:0;Margin:0">
           <table cellspacing="0" bgcolor="#E8F5EC" align="center" cellpadding="0" class="es-content-body" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;background-color:#E8F5EC;width:600px">
            <tbody>
             <tr>
              <td align="left" class="es-m-p20l es-m-p20r" style="Margin:0;padding:30px 35px 40px">
               <table width="100%" cellspacing="0" cellpadding="0" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px">
                <tbody>
                 <!-- Card with the text and the button -->
                 <tr>
                  <td valign="top" align="center" style="padding:0;Margin:0;border-radius:20px;overflow:hidden;width:530px">
                   <table width="100%" cellspacing="0" cellpadding="0" bgcolor="#ffffff" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;background-color:#ffffff;border-radius:20px;border-collapse:separate;border:1px solid #D6EBDD" role="presentation">
                    <tbody>
                     <tr>
                      <td align="left" style="padding:35px 35px 15px;Margin:0"><h1 style="Margin:0;font-family:Inter, Arial, sans-serif;mso-line-height-rule:exactly;letter-spacing:0;font-size:32px;font-style:normal;font-weight:bold;line-height:40px;color:#0F2E1A">{{title}}</h1></td>
                     </tr>
                     <tr>
                      <td align="left" style="padding:0 35px 30px;Margin:0"><p style="Margin:0;mso-line-height-rule:exactly;font-family:Inter, Arial, sans-serif;line-height:24px;letter-spacing:0;font-weight:normal;color:#0F2E1A;font-size:16px">{{body}}</p></td>
                     </tr>
                     <tr>
                      <td align="left" style="padding:0 35px 20px;Margin:0"><!--[if mso]><a href="{{ctaUrl}}" target="_blank" hidden>
    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" esdevVmlButton href="{{ctaUrl}}" style="height:54px; v-text-anchor:middle; width:260px" arcsize="50%" stroke="f"  fillcolor="#149440">
        <w:anchorlock></w:anchorlock>
        <center style='color:#ffffff; font-family:Inter, Arial, sans-serif; font-size:20px; font-weight:700; line-height:20px;  mso-text-raise:1px'>{{ctaLabel}}</center>
    </v:roundrect></a>
<![endif]--><!--[if !mso]><!-- --><span class="es-button-border msohide" style="border-style:solid;border-color:#149440;background:#149440;border-width:0px;display:inline-block;border-radius:30px;width:auto;mso-hide:all"><a href="{{ctaUrl}}" target="_blank" class="es-button" style="mso-style-priority:100 !important;text-decoration:none !important;mso-line-height-rule:exactly;color:#FFFFFF;font-size:20px;font-weight:bold;padding:15px 30px;display:inline-block;background:#149440;border-radius:30px;font-family:Inter, Arial, sans-serif;font-style:normal;line-height:24px;width:auto;text-align:center;letter-spacing:0;mso-padding-alt:0;mso-border-alt:10px solid #149440;text-transform:none">{{ctaLabel}}</a></span><!--<![endif]--></td>
                     </tr>
                     <!-- Fallback link for clients that block buttons -->
                     <tr>
                      <td align="left" style="padding:0 35px 35px;Margin:0"><p style="Margin:0;mso-line-height-rule:exactly;font-family:Inter, Arial, sans-serif;line-height:20px;letter-spacing:0;font-weight:normal;color:#4B6355;font-size:13px">Se o botão não funcionar, copie e cole este endereço no navegador:<br><a href="{{ctaUrl}}" target="_blank" style="mso-line-height-rule:exactly;text-decoration:underline;color:#149440;font-size:13px;word-break:break-all">{{ctaUrl}}</a></p></td>
                     </tr>
                    </tbody>
                   </table></td>
                 </tr>
                </tbody>
               </table></td>
             </tr>
            </tbody>
           </table></td>
         </tr>
        </tbody>
       </table>
       <!-- Footer: why this e-mail came, one-click unsubscribe and the preferences -->
       <table cellspacing="0" cellpadding="0" align="center" class="es-footer" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;width:100%;table-layout:fixed !important">
        <tbody>
         <tr>
          <td align="center" style="padding:0;Margin:0">
           <table cellspacing="0" cellpadding="0" bgcolor="#E8F5EC" align="center" class="es-footer-body" role="none" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px;background-color:#E8F5EC;width:600px;border-top:1px solid #D6EBDD">
            <tbody>
             <tr>
              <td align="center" class="es-m-p20l es-m-p20r" style="padding:30px 45px 40px;Margin:0">
               <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0pt;mso-table-rspace:0pt;border-spacing:0px">
                <tbody>
                 <tr>
                  <td align="center" style="padding:0;Margin:0"><p style="Margin:0;mso-line-height-rule:exactly;font-family:Inter, Arial, sans-serif;line-height:21px;letter-spacing:0;font-weight:normal;color:#4B6355;font-size:13px">Você recebe isso porque os e-mails de <strong style="color:#0F2E1A">{{categoryLabel}}</strong> estão ligados.<br><a href="{{unsubscribeUrl}}" target="_blank" style="mso-line-height-rule:exactly;text-decoration:underline;color:#0F2E1A">Desativar</a> · <a href="{{preferencesUrl}}" target="_blank" style="mso-line-height-rule:exactly;text-decoration:underline;color:#0F2E1A">Preferências</a></p></td>
                 </tr>
                 <tr>
                  <td align="center" style="padding:15px 0 0;Margin:0"><p style="Margin:0;mso-line-height-rule:exactly;font-family:Inter, Arial, sans-serif;line-height:21px;letter-spacing:0;font-weight:normal;color:#4B6355;font-size:13px"><a href="{{appUrl}}" target="_blank" style="mso-line-height-rule:exactly;text-decoration:none;color:#0F2E1A;font-weight:bold">Futspring</a> — organize a sua pelada.</p></td>
                 </tr>
                </tbody>
               </table></td>
             </tr>
            </tbody>
           </table></td>
         </tr>
        </tbody>
       </table></td>
     </tr>
    </tbody>
   </table>
  </div>
 </body>
</html>
