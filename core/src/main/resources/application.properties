# Configurações do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://futspring-postgres-dev:5432/futspringdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Hikari remains the concurrency limit when request and async tasks use virtual threads
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
# PgJDBC leaves the server's "Detail: Key (email)=(...)" out of exception messages, so a constraint violation logged
# by Hibernate or GlobalExceptionHandler never carries the row's values (e-mails). The constraint name stays
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.threads.virtual.enabled=true
# STOMP declares Executor beans; keep Boot's applicationTaskExecutor for @Async as well
spring.task.execution.mode=force

# Configurações do JPA/Hibernate
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway: an existing database without flyway_schema_history is marked as V1 (baseline) instead of running it
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logs: one JSON line per event in Elastic Common Schema (collected by Alloy into Loki, ops/observability).
# Plain text locally: LOGGING_STRUCTURED_FORMAT_CONSOLE= (empty; docker-compose.dev.yml sets it)
logging.structured.format.console=ecs
logging.structured.ecs.service.name=futspring-api

# Configuração do Servidor
server.port=8080
# Behind nginx: Tomcat's RemoteIpValve makes getRemoteAddr() the client IP (rate limiting). It reads X-Forwarded-For
# right to left and skips trusted proxies, so a value the client injects at the left is ignored. internal-proxies
# keeps Boot's default (loopback + 10/8, 172.16/12, 192.168/16): nginx reaches the container through Docker's
# published port, so the peer the API sees is the Docker network gateway (172.x.0.1), not 127.0.0.1
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# Allowed browser origins (comma-separated), shared by HTTP CORS and the STOMP endpoint
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Configurações Customizadas da Aplicação (JWT)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Frontend base URL, used to build links sent by e-mail (password reset)
app.frontend-url=${APP_URL:http://localhost:5173}
# Public base URL of the API, for links a mail provider calls directly (List-Unsubscribe one-click).
# Production: https://futspring.luisgosampaio.com/api (nginx strips /api before proxying)
app.api-url=${API_URL:http://localhost:8080}

# E-mail (Resend). Without an API key the app does not send e-mails
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Futspring <no-reply@futspring.luisgosampaio.com>}

# Web Push (VAPID). Without the private key push is off (no-op sender, GET /push/vapid-public-key answers 204)
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid-subject=${VAPID_SUBJECT:mailto:contato@futspring.luisgosampaio.com}

# Pix the platform is paid with (the creator's Assinatura area); empty key = no Pix on screen. See BillingPixConfig
app.billing.pix-key=${BILLING_PIX_KEY:}
app.billing.pix-name=${BILLING_PIX_NAME:}
app.billing.pix-merchant-name=${BILLING_PIX_MERCHANT_NAME:}
app.billing.pix-city=${BILLING_PIX_CITY:}

# File uploads
app.uploads.dir=/app/uploads

# Multipart / request size limits (allow champion images up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Actuator on an internal port (never published by Docker): only /livez and /readyz are served on server.port
management.server.port=9091
# Only what Prometheus and the HEALTHCHECK use; health never shows its components (pool, database, disk).
# Reopen others on demand with MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE (the load test does)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.metrics.tags.application=futspring
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# OpenAPI docs (/v3/api-docs) and Swagger UI (/swagger-ui.html): off unless API_DOCS_ENABLED=true (dev compose)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Private financial images: never put these inside app.uploads.dir.
app.finance.receipts-dir=${FINANCE_RECEIPTS_DIR:/app/finance-receipts}
app.finance.qr-dir=${FINANCE_QR_DIR:/app/finance-qr}
