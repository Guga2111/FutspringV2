# Configurações do Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://futspring-postgres-dev:5432/futspringdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configurações do JPA/Hibernate
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway: an existing database without flyway_schema_history is marked as V1 (baseline) instead of running it
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Configuração do Servidor
server.port=8080
# Behind nginx: trust X-Forwarded-* so getRemoteAddr() is the client IP (rate limiting)
server.forward-headers-strategy=framework

# Allowed browser origins (comma-separated), shared by HTTP CORS and the STOMP endpoint
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Configurações Customizadas da Aplicação (JWT)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# File uploads
app.uploads.dir=/app/uploads

# Multipart / request size limits (allow champion images up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB