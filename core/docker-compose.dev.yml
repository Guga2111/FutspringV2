services:
  futspring-api-dev:
    build: . # Constrói a imagem a partir do Dockerfile na pasta atual
    container_name: futspring_api_dev
    ports:
      - "8080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USERNAME: futspringuser
      DB_PASSWORD: futspringpassword
      JWT_SECRET: dev-local-secret-change-me-in-production
      # From core/.env (gitignored), next to this file; empty key = e-mails are only logged (NoopEmailSender)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Futspring <no-reply@futspring.luisgosampaio.com>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@futspring.luisgosampaio.com}
      BILLING_PIX_KEY: ${BILLING_PIX_KEY:-}
      BILLING_PIX_NAME: ${BILLING_PIX_NAME:-}
      BILLING_PIX_MERCHANT_NAME: ${BILLING_PIX_MERCHANT_NAME:-}
      BILLING_PIX_CITY: ${BILLING_PIX_CITY:-}
      APP_URL: ${APP_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:8080}
      # OpenAPI docs + Swagger UI (http://localhost:8080/swagger-ui.html); off in production
      API_DOCS_ENABLED: "true"
      # plain text logs in dev (production logs ECS JSON, see application.properties)
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ""
      REDIS_HOST: futspring-redis-dev
      REDIS_PASSWORD: dev-redis-password
    volumes:
      - ./uploads:/app/uploads
      - ./finance-receipts:/app/finance-receipts
      - ./finance-qr:/app/finance-qr
    depends_on:
      - futspring-postgres-dev
      - futspring-redis-dev

  futspring-postgres-dev:
    # same major version as production (Supabase). A volume created by Postgres 15 can't be opened:
    # docker compose -f docker-compose.dev.yml down -v (the dev data is the DataInitializer seed)
    image: postgres:17-alpine
    container_name: futspring_postgres_dev
    ports:
      - "5432:5432" # Expõe a porta para o DBeaver, etc.
    environment:
      POSTGRES_DB: futspringdb
      POSTGRES_USER: futspringuser
      POSTGRES_PASSWORD: futspringpassword
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  futspring-redis-dev:
    # Same image and flags as production; no published port (only the API reaches it)
    image: redis:7.4.12-alpine
    container_name: futspring_redis_dev
    environment:
      REDIS_PASSWORD: dev-redis-password
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    volumes:
      - redis_data_dev:/data

volumes:
  postgres_data_dev:
  redis_data_dev: