# Production stack on the VPS. deploy.sh copies this file and .env to ~/projects/futspring
# and loads the futspring-api image built on the runner (no build here).
name: futspring

services:
  futspring-api:
    image: futspring-api:latest
    container_name: futspring_api
    ports:
      # Only reachable through nginx on the host
      - "127.0.0.1:${API_PORT:-8081}:8080"
    restart: unless-stopped
    # The JVM takes 75% of it as max heap (MaxRAMPercentage in the image); revisit with the Grafana numbers
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@futspring.luisgosampaio.com}
      BILLING_PIX_KEY: ${BILLING_PIX_KEY:-}
      BILLING_PIX_NAME: ${BILLING_PIX_NAME:-}
      BILLING_PIX_MERCHANT_NAME: ${BILLING_PIX_MERCHANT_NAME:-}
      BILLING_PIX_CITY: ${BILLING_PIX_CITY:-}
      REDIS_HOST: futspring-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # DDL_AUTO is intentionally absent: Flyway owns the schema, Hibernate validates it
    volumes:
      # owned by uid 10001 (the image's user); deploy.sh chowns it
      - /opt/futspring-uploads:/app/uploads
      # Temporary receipts MUST remain excluded from durable host/file backups.
      - /opt/futspring-finance-receipts:/app/finance-receipts
      - /opt/futspring-finance-qr:/app/finance-qr
    # default: the project network; observability: Prometheus scrapes futspring_api:9091 (never published)
    networks:
      - default
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No depends_on: Redis is not needed to start or be ready (only refreshing sessions uses it).
    # deploy.sh waits for both containers to be healthy

  futspring-redis:
    # Refresh-token sessions. AOF on, so a restart doesn't log everyone out; no published port,
    # only on the project network (the API's default network)
    image: redis:7.4.12-alpine
    container_name: futspring_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # The password is read from the container's env ($$ escapes compose interpolation).
    # maxmemory below mem_limit leaves room for the AOF rewrite fork; noeviction (the default) never drops a session
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    volumes:
      - redis_data:/data
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  observability:
    # created by deploy.sh and the observability deploy (docker network create observability)
    external: true
